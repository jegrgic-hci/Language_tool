<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- vraiFrench mark: the "Heavy ink" helium atom. Nucleus, one orbit (r33,
       stroke 9), two electrons (top + bottom) with the orbit cut away 4.5 around
       each. The orbit is drawn as two filled halves with the cuts built in (no
       SVG mask), because pages use this file as a CSS mask image.
       Single colour: pages tint it with .pa-brand-mark (see vk-atelier-components.css).
       Never write a double hyphen in this comment: XML forbids it and the file stops loading. -->
