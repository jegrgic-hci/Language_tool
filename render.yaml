services:
  - type: web
    name: french-tutor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: french-tutor-data
      mountPath: /data
      sizeGB: 1
